name: ScholarAgent CI

# Triggers on push or pull request targeting the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js runtime with npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Deterministic dependency installation based on package-lock.json
      - name: Install Dependencies
        run: npm ci

      # 4. Static type checking without compilation output
      - name: Typecheck
        run: npx tsc --noEmit

      # 5. Code style and quality verification
      - name: Run Linter
        run: npm run lint

      # 6. Execute test suite
      - name: Run Tests
        run: npm test

  build-containers:
    # Runs only after test-and-lint job succeeds
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx for optimized caching and multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Verify Docker build for the web application
      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: scholaragent-web:latest

      # 4. Verify Docker build for the background worker
      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.worker
          push: false
          tags: scholaragent-worker:latest