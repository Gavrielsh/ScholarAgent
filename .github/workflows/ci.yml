name: ScholarAgent CI

# Triggers on push or pull request targeting the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A second push to the same branch makes the first run's result irrelevant.
# Cancel it rather than paying for a queue of superseded runs — this workflow
# also builds two Docker images, so a superseded run is not cheap. Never cancel
# on main: those runs are the record of what the branch actually does.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Neither job writes to the repository, and the Docker images are built but
# never pushed, so the default read/write token is more access than this needs.
permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js runtime with npm caching
      # Node 20 to match docker/Dockerfile and docker/Dockerfile.worker
      # (both node:20-alpine). On 22 this job would validate a runtime the
      # shipped images do not use, so a version-specific failure could pass
      # here and still break the image build.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Deterministic dependency installation based on package-lock.json
      - name: Install Dependencies
        run: npm ci

      # 4. Static type checking without compilation output.
      #
      # This and the two steps below each run even if an earlier one failed: a
      # type error and a failing test are usually independent, and seeing both
      # in one run beats fixing them one round trip at a time.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      # 5. Code style and quality verification
      - name: Run Linter
        if: ${{ !cancelled() }}
        run: npm run lint

      # 6. Execute test suite
      - name: Run Tests
        if: ${{ !cancelled() }}
        run: npm test

  build-containers:
    # Runs only after test-and-lint job succeeds
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx for optimized caching and multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Verify Docker build for the web application
      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: scholaragent-web:latest

      # 4. Verify Docker build for the background worker
      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.worker
          push: false
          tags: scholaragent-worker:latest