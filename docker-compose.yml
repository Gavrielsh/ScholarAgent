services:
  # Local development and thesis benchmarking database. Runs in the default
  # profile alongside redis so `docker compose up -d` brings up everything the
  # test suite, the migration runner and scripts/evaluate_runner.ts need, with
  # no external network latency in the measurements.
  #
  # The image must carry pgvector: 001_initial_schema.sql declares vector(768)
  # columns and HNSW indexes with vector_cosine_ops. Override POSTGRES_IMAGE if
  # an existing data volume was initialised under a different major version —
  # Postgres refuses to start against a data directory from another major.
  # Check with: docker run --rm -v scholaragent_scholaragent-pgdata:/v alpine cat /v/PG_VERSION
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: scholaragent-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # Applied only when the data directory is empty. An existing volume keeps
      # whatever role it was created with, so these defaults match the volume
      # already in use rather than inventing new credentials.
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-scholaragent}
    volumes:
      # Named rather than a host bind mount. A bind mount is what broke the
      # previous container: its path pointed into a OneDrive directory that had
      # moved, and Postgres would not start.
      #
      # Deliberately no /docker-entrypoint-initdb.d mount. initdb would apply
      # 001_initial_schema.sql without inserting the corresponding row into
      # schema_migrations, so `npm run migrate` would then try to apply it a
      # second time against a populated database. `npm run migrate` is the one
      # path that both applies and stamps schema.
      - scholaragent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-scholaragent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scholaragent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: scholaragent-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PG_SSLMODE: ${PG_SSLMODE:-require}
      PG_POOL_MAX: "10"
      PG_POOL_MIN: "1"
      LLM_PROVIDER: mock
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-dev-verify-token}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      REDIS_URL: redis://redis:6379

  whatsapp-worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: scholaragent-whatsapp-worker
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PG_SSLMODE: ${PG_SSLMODE:-require}
      PG_POOL_MAX: "10"
      PG_POOL_MIN: "1"
      LLM_PROVIDER: mock
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      USER_MGMT_DEBUG: ${USER_MGMT_DEBUG:-0}
      WORKER_SHUTDOWN_TIMEOUT_MS: "25000"
      WHATSAPP_JOB_TIMEOUT_MS: "90000"

volumes:
  # Resolves to scholaragent_scholaragent-pgdata under the default project name,
  # which is the volume already holding the 001_initial_schema database — so
  # this adopts the existing data instead of starting empty.
  scholaragent-pgdata: