services:
  redis:
    image: redis:7-alpine
    container_name: scholaragent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: scholaragent-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PG_SSLMODE: ${PG_SSLMODE:-require}
      PG_POOL_MAX: "10"
      PG_POOL_MIN: "1"
      LLM_PROVIDER: mock
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-dev-verify-token}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      REDIS_URL: redis://redis:6379

  whatsapp-worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: scholaragent-whatsapp-worker
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PG_SSLMODE: ${PG_SSLMODE:-require}
      PG_POOL_MAX: "10"
      PG_POOL_MIN: "1"
      LLM_PROVIDER: mock
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      USER_MGMT_DEBUG: ${USER_MGMT_DEBUG:-0}
      WORKER_SHUTDOWN_TIMEOUT_MS: "25000"
      WHATSAPP_JOB_TIMEOUT_MS: "90000"