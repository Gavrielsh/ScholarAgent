services:
  # Local development and thesis benchmarking database. Runs in the default
  # profile alongside redis so `docker compose up -d` brings up everything the
  # test suite, the migration runner and scripts/evaluate_runner.ts need, with
  # no external network latency in the measurements.
  #
  # The image must carry pgvector: 001_initial_schema.sql declares vector(768)
  # columns and HNSW indexes with vector_cosine_ops. Override POSTGRES_IMAGE if
  # an existing data volume was initialised under a different major version —
  # Postgres refuses to start against a data directory from another major.
  # Check with: docker run --rm -v scholaragent_scholaragent-pgdata:/v alpine cat /v/PG_VERSION
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: scholaragent-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # Applied only when the data directory is empty. An existing volume keeps
      # whatever role it was created with, so these defaults match the volume
      # already in use rather than inventing new credentials.
      #
      # NOTE: the Postgres entrypoint always creates POSTGRES_USER as a
      # SUPERUSER, and a superuser bypasses every row-level security policy
      # regardless of FORCE ROW LEVEL SECURITY. By design this role is only the
      # owner/migrator: migrations/001_initial_schema.sql creates a NOBYPASSRLS
      # role and withRlsTransaction drops into it with SET LOCAL ROLE before
      # querying. Do not rely on this connection role being unprivileged.
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-scholaragent}
    volumes:
      # Named rather than a host bind mount. A bind mount is what broke the
      # previous container: its path pointed into a OneDrive directory that had
      # moved, and Postgres would not start.
      #
      # Deliberately no /docker-entrypoint-initdb.d mount. initdb would apply
      # 001_initial_schema.sql without inserting the corresponding row into
      # schema_migrations, so `npm run migrate` would then try to apply it a
      # second time against a populated database. `npm run migrate` is the one
      # path that both applies and stamps schema.
      - scholaragent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-scholaragent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scholaragent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Configuration for `app` and `whatsapp-worker` (the `full` profile).
  #
  # Secrets and tuning (LLM_PROVIDER, GEMINI_API_KEY, WHATSAPP_*, ...) come from
  # .env.local through `env_file` — the same file `npm run dev` and every script
  # read — so there is one place to configure them. `required: false` keeps
  # `docker compose up` working without it (the core services never read it).
  #
  # The `environment:` entries below are ONLY the values that must differ inside
  # the compose network, and they win over env_file. Do not add pass-throughs such
  # as `GEMINI_API_KEY: ${GEMINI_API_KEY:-}` here: Compose interpolates those from
  # the shell or `.env`, not `.env.local`, so they resolve to "" and silently
  # overwrite the real value that env_file just loaded.
  #
  # DATABASE_URL points at the `postgres` service by name — `localhost` in
  # .env.local means the container itself in here. It follows the POSTGRES_*
  # defaults above; export DATABASE_URL in the shell to point at a managed
  # database instead (and set PG_SSLMODE=require for it).
  # ---------------------------------------------------------------------------
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: scholaragent-app
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-scholaragent}}
      # The bundled Postgres container does not terminate TLS.
      PG_SSLMODE: ${PG_SSLMODE:-disable}
      PG_POOL_MAX: "10"
      PG_POOL_MIN: "1"
      REDIS_URL: redis://redis:6379

  whatsapp-worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: scholaragent-whatsapp-worker
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-scholaragent}}
      PG_SSLMODE: ${PG_SSLMODE:-disable}
      PG_POOL_MAX: "10"
      PG_POOL_MIN: "1"
      REDIS_URL: redis://redis:6379
      WORKER_SHUTDOWN_TIMEOUT_MS: "25000"
      WHATSAPP_JOB_TIMEOUT_MS: "90000"

volumes:
  # Resolves to scholaragent_scholaragent-pgdata under the default project name,
  # which is the volume already holding the 001_initial_schema database — so
  # this adopts the existing data instead of starting empty.
  scholaragent-pgdata: